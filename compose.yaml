name: association-tresorerie

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tresorerie}
      POSTGRES_USER: ${POSTGRES_USER:-tresorerie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tresorerie-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tresorerie}:${POSTGRES_PASSWORD:-tresorerie-local}@database:5432/${POSTGRES_DB:-tresorerie}
      JWT_SECRET: ${JWT_SECRET:-secret-local-a-remplacer}
      STORAGE_DIR: /app/storage
      CODEX_HOME: /app/codex-data
      PROMPTS_DIR: /app/prompts
      MIGRATION_FILE: /app/sql/001_init.sql
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_SEED_FILE: /app/sql/002_demo_seed.sql
    volumes:
      - document-storage:/app/storage
      - codex-credentials:/app/codex-data
      - gemini-credentials:/home/node/.gemini
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres-data:
  document-storage:
  codex-credentials:
  gemini-credentials:

networks:
  internal:

